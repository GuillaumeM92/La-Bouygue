# La Bouygue: /etc/nginx/sites-enabled/la_bouygue on the server.
# Copy kept in the repository for reference; the ssl_* lines are managed by
# Certbot. After an edit: nginx -t && systemctl reload nginx

# Content-hashed static names (bergerie.3f2a1c9e7b10.css) never change, so
# browsers may keep them a year; anything else is checked again after an hour.
map $uri $la_bouygue_static_cache {
    "~\.[0-9a-f]{12}\.[A-Za-z0-9]+$"  "public, max-age=31536000, immutable";
    default                            "public, max-age=3600";
}

server {
    server_name labouygue.fr www.labouygue.fr;
    root /home/ubuntu/My-Websites/La-Bouygue/;
    server_tokens off;
    # Photos are sent as base64 in the form: two of them can pass 1 MB
    client_max_body_size 10m;

    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
        proxy_pass http://127.0.0.1:8000;
    }

    location /static/ {
        alias /home/ubuntu/My-Websites/La-Bouygue/staticfiles/;
        add_header Cache-Control $la_bouygue_static_cache;
    }

    location /media/ {
        alias /home/ubuntu/My-Websites/La-Bouygue/media/;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Shown instead of "502 Bad Gateway" while Gunicorn restarts or is down
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /home/ubuntu/My-Websites/La-Bouygue/staticfiles/bouygue;
        internal;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/famille.guillaume-merle.fr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/famille.guillaume-merle.fr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.labouygue.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = labouygue.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name labouygue.fr www.labouygue.fr;
    listen 80;
    return 404; # managed by Certbot
}
