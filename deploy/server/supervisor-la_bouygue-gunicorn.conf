; La Bouygue: /etc/supervisor/conf.d/la_bouygue-gunicorn.conf on the server.
; Copy kept in the repository for reference.
; After an edit: supervisorctl reread && supervisorctl update
[program:la_bouygue-gunicorn]
; Two workers: one slow request no longer holds up everybody else
command = /home/ubuntu/My-Websites/La-Bouygue/env/bin/gunicorn config.wsgi:application --workers 2
user = ubuntu
directory = /home/ubuntu/My-Websites/La-Bouygue/
autostart = true
autorestart = true
