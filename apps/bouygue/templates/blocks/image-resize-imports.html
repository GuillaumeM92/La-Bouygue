{% load static %}
{% comment %}
    Widget de recadrage d'image (django-client-side-image-cropping).
    Le gabarit d'origine enveloppait ces balises dans un second <head>, en
    plein milieu du <body> : le navigateur le jetait. Elles sont désormais
    posées telles quelles — les navigateurs acceptent <link> et <script> dans
    le corps du document.
{% endcomment %}
<link rel="stylesheet" href="{% static 'client_side_image_cropping/croppie.css' %}" />
<link rel="stylesheet" href="{% static 'client_side_image_cropping/cropping_widget.css' %}" />
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
<script src="{% static 'client_side_image_cropping/croppie.min.js' %}"></script>
<script src="{% static 'client_side_image_cropping/cropping_widget.js' %}"></script>
