<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>La Bouygue — Connexion requise</title>
    <style>
        /* Page autonome : elle doit s'afficher meme si le site est a l'arret,
           donc aucune dependance a une feuille de style externe. */
        :root { color-scheme: light; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem 1.25rem;
            background-color: #f6f1e6;
            color: #282320;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 1.05rem;
            line-height: 1.6;
            text-align: center;
        }
        .boite {
            max-width: 34rem;
            background-color: #fffcf4;
            border: 1px solid #c9bca3;
            border-top: 5px solid #8a5a38;
            border-radius: 7px;
            padding: 2.5rem 2rem;
            box-shadow: 0 14px 34px rgba(58, 42, 26, .18);
        }
        svg { width: 76px; height: 64px; color: #d59a2e; }
        .code {
            font-size: 3.5rem;
            font-weight: 700;
            line-height: 1;
            color: #c9bca3;
            letter-spacing: -.03em;
            margin: .5rem 0 .25rem;
        }
        h1 { font-family: Georgia, 'Times New Roman', serif; font-size: 1.75rem; margin: 0 0 .75rem; }
        p { color: #635a50; margin: 0 0 1.5rem; }
        a {
            display: inline-block;
            background-color: #ae5029;
            color: #fffaf1;
            font-weight: 700;
            text-decoration: none;
            border-radius: 4px;
            padding: .7rem 1.4rem;
        }
        a:hover { background-color: #8e3d1d; }
    </style>
</head>
<body>
    <main class="boite">
        <svg viewBox="0 0 30 26" fill="none" aria-hidden="true">
            <path d="M1 20 L8.5 5.5 L13 12.5 L17 3 L29 20 Z" fill="currentColor" opacity=".55"/>
            <path d="M9 25 V15.5 L15.5 10.5 L22 15.5 V25 Z" fill="currentColor"/>
            <path d="M6.5 16.5 L15.5 9 L24.5 16.5" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="code">401</div>
        <h1>Connexion requise</h1>
        <p>Cette page demande d'être connecté. Identifiez-vous, puis réessayez.</p>
        <a href="/">Revenir à l'accueil</a>
    </main>
</body>
</html>
