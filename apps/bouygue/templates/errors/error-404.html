{% extends "bouygue/base.html" %}
{% load static %}
{% block content %}
<div hidden>{% block title %} — Erreur 404 {% endblock %}</div>
<div class="berg-erreur">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-7 col-md-9">
                <img class="img-fluid" src="{% static 'bouygue/assets/img/illustrations/404-error-with-a-cute-animal.svg' %}" alt="" />
                <div class="berg-erreur-code">404</div>
                <h1>Page introuvable</h1>
                <p class="mb-4">Cette page n'existe pas, ou plus. Le chemin s'est peut-être perdu en route.</p>
                <div class="berg-erreur-actions">
                    <a class="btn btn-primary" href="{% url 'bouygue-home' %}">Retour à l'accueil</a>
                    <a class="btn btn-outline-primary" onClick="javascript:history.go(-1);">Revenir en arrière</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
